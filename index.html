<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Caza Ofertas</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card img { max-width: 100%; height: 180px; object-fit: contain; }
    .price { color: #e67e22; font-size: 1.2em; font-weight: bold; }
    .btn { display: inline-block; padding: 10px; background: #27ae60; color: #fff; text-decoration: none; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Las Mejores Ofertas del Día</h1>
  <div class="grid">
    <div class="card">
      <img src="https://example.com/product1.jpg" alt="Producto 1">
      <h2>Producto 1</h2>
      <p class="price">$19.99</p>
      <a href="https://example.com/product1" class="btn">Comprar</a>
    </div>
    <div class="card">
      <img src="https://example.com/product2.jpg" alt="Producto 2">
      <h2>Producto 2</h2>
      <p class="price">$29.99</p>
      <a href="https://example.com/product2" class="btn">Comprar</a>
    </div>
    <div class="card">
      <img src="https://example.com/product3.jpg" alt="Producto 3">
      <h2>Producto 3</h2>
      <p class="price">$49.99</p>
      <a href="https://example.com/product3" class="btn">Comprar</a>
    </div>
    <div class="card">
      <img src="https://example.com/product4.jpg" alt="Producto 4">
      <h2>Producto 4</h2>
      <p class="price">$39.99</p>
      <a href="https://example.com/product4" class="btn">Comprar</a>
    </div>
  </div>
</body>
</html>
